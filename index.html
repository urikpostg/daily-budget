<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Budget</title>
<style>
  :root{
    --bg:#0b0d10;
    --card:#16191d;
    --card2:#1d2126;
    --text:#f2f3f5;
    --muted:#8b929c;
    --accent:#34c759;
    --accent2:#0a84ff;
    --danger:#ff453a;
    --border:#2a2e34;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f2f7;
      --card:#ffffff;
      --card2:#f7f7fa;
      --text:#1c1c1e;
      --muted:#6e6e73;
      --border:#e5e5ea;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  header{
    padding:calc(20px + env(safe-area-inset-top)) 20px 12px;
    position:sticky; top:0; z-index:10;
    background:var(--bg);
  }
  header h1{
    font-size:22px;
    margin:0;
    font-weight:700;
  }
  header .sub{
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
  }
  .header-row{
    display:flex; align-items:flex-start; justify-content:space-between;
    max-width:520px; margin:0 auto;
  }
  .header-icons{ display:flex; gap:8px; margin-top:1px; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--card2); border:1px solid var(--border);
    font-size:17px; display:flex; align-items:center; justify-content:center;
    color:var(--text); line-height:1;
  }
  .icon-btn:active{ opacity:.7; }
  main{padding:0 16px; max-width:520px; margin:0 auto;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:200;
  }
  .modal-sheet{
    background:var(--card);
    width:100%; max-width:520px;
    border-radius:20px 20px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .modal-header h2{
    margin:0; font-size:16px; font-weight:700; color:var(--text);
    text-transform:none; letter-spacing:normal;
  }
  .modal-close{
    background:var(--card2); border:none; border-radius:50%;
    width:30px; height:30px; min-width:30px; color:var(--text); font-size:15px;
    display:flex; align-items:center; justify-content:center; padding:0;
  }

  .hero{
    background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px 20px;
    margin-bottom:16px;
    text-align:center;
  }
  .hero .label{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em;}
  .hero .amount{
    font-size:48px;
    font-weight:800;
    margin:6px 0 4px;
    letter-spacing:-0.02em;
  }
  .hero .amount.negative{ color:var(--danger); }
  .hero .amount.positive{ color:var(--accent); }
  .hero .detail{color:var(--muted); font-size:13px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin:0 0 10px;
    font-weight:600;
  }
  .row{display:flex; gap:10px; align-items:center;}
  .row + .row{margin-top:10px;}

  .card-toggle{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; background:none; border:none; padding:0; margin:0;
    cursor:pointer; text-align:left;
  }
  .card-toggle h2{ margin:0; }
  .chevron{ color:var(--muted); font-size:13px; }

  label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px;}
  input[type=text], input[type=number], input[type=date]{
    width:100%;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    color:var(--text);
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus{
    border-color:var(--accent2);
  }
  .field{flex:1; min-width:0;}

  .seg{
    display:flex;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:2px;
  }
  .seg button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    padding:8px 0;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
  }
  .seg button.active{
    background:var(--accent2);
    color:#fff;
  }

  .btn{
    display:block;
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:16px;
    font-weight:700;
    background:var(--accent2);
    color:#fff;
    margin-top:12px;
  }
  .btn:active{opacity:.8;}
  .btn.secondary{
    background:var(--card2);
    color:var(--text);
    border:1px solid var(--border);
  }

  .payment{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .payment.paid{opacity:.5;}
  .check{
    width:26px;height:26px;
    min-width:26px;
    border-radius:50%;
    border:2px solid var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    color:transparent;
  }
  .payment.paid .check{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .payment .info{flex:1; min-width:0;}
  .payment .name{font-weight:600; font-size:15px;}
  .payment .name.paid-strike{text-decoration:line-through;}
  .payment .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .payment .amt{text-align:right;}
  .payment .amt .uah{font-weight:700; font-size:15px;}
  .payment .amt .usd{font-size:12px; color:var(--muted);}
  .del{
    background:none;border:none;color:var(--danger);
    font-size:20px; padding:0 2px; line-height:1;
  }

  .empty{color:var(--muted); text-align:center; padding:14px 0; font-size:14px;}

  .rate-note{font-size:12px; color:var(--muted); margin-top:8px; text-align:center;}
  .rate-note button{
    background:none;border:none;color:var(--accent2);
    font-size:12px; padding:0; margin-left:4px;
  }

  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:#000; color:#fff; padding:10px 18px; border-radius:20px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:100;
  }
  .toast.show{opacity:.92;}

  body.readonly #leftover,
  body.readonly .payment .check,
  body.readonly .payment .del,
  body.readonly #addBtn,
  body.readonly #pName,
  body.readonly #pAmount,
  body.readonly #pDay,
  body.readonly #currSeg button{
    opacity:.45;
  }

  .chart-legend{
    margin-top:10px; padding:10px 12px;
    background:var(--card2); border:1px solid var(--border);
    border-radius:10px; font-size:13px; color:var(--text);
  }

  /* ---- Responsive breakpoints ---- */
  /* Default styles above are mobile (portrait phones). */

  @media (min-width: 700px){
    .header-row, main{ max-width:820px; }

    .hero{ padding:28px 36px; }
    .hero .amount{ font-size:56px; }

    #paymentsList{
      display:grid; grid-template-columns:repeat(2, 1fr); gap:10px 14px;
      align-items:start;
    }
    #paymentsList .payment{ margin-bottom:0; }
    #paymentsList > .empty,
    #paymentsList > #paidToggle,
    #paymentsList > #paidList{
      grid-column:1 / -1;
    }
    #paidList{
      display:grid; grid-template-columns:repeat(2, 1fr); gap:10px 14px;
    }

    .modal-backdrop{ align-items:center; padding:20px; }
    .modal-sheet{ border-radius:20px; max-width:520px; max-height:80vh; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1>💰 Daily Budget</h1>
      <div class="sub" id="datesub">—</div>
    </div>
    <div class="header-icons">
      <button class="icon-btn" id="statsIconBtn" type="button" aria-label="Budget history">📊</button>
      <button class="icon-btn" id="peopleIconBtn" type="button" aria-label="Share & account">👥</button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <div class="label">Daily budget</div>
    <div class="amount" id="dailyAmount">₴0</div>
    <div class="detail" id="heroDetail">—</div>
  </div>

  <div class="card">
    <h2>What's left on card</h2>
    <div class="row">
      <div class="field">
        <input type="number" inputmode="decimal" id="leftover" placeholder="0" step="0.01">
      </div>
      <div style="color:var(--muted); font-weight:600;">UAH</div>
    </div>
  </div>

  <div class="card">
    <h2>Regular payments</h2>
    <div id="paymentsList"><div class="empty">No payments yet</div></div>
  </div>

  <div class="card">
    <h2>Add regular payment</h2>
    <div class="row">
      <div class="field">
        <label>Name</label>
        <input type="text" id="pName" placeholder="e.g. Rent">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Currency</label>
        <div class="seg" id="currSeg">
          <button type="button" data-c="UAH" class="active">UAH</button>
          <button type="button" data-c="USD">USD</button>
          <button type="button" data-c="EUR">EUR</button>
        </div>
      </div>
      <div class="field">
        <label id="amtLabel">Amount (UAH)</label>
        <input type="number" inputmode="decimal" id="pAmount" placeholder="0" step="0.01">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Days after salary</label>
        <input type="number" inputmode="numeric" id="pDay" placeholder="e.g. 5" min="0" max="31">
      </div>
    </div>
    <button class="btn" id="addBtn">Add payment</button>
    <div class="rate-note" id="rateNote">Rate: —</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="shareModalBackdrop" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>Share &amp; account</h2>
      <button class="modal-close" id="shareModalClose" type="button">✕</button>
    </div>

    <div class="row">
      <div class="field">
        <input type="text" id="shareLink" readonly>
      </div>
    </div>
    <button class="btn secondary" id="shareBtn">Share link</button>

    <div class="rate-note" id="accessNote">Checking access…</div>
    <button class="btn secondary" id="signInBtn" style="display:none;">Sign in to edit</button>
    <button class="btn secondary" id="claimBtn" style="display:none;">Claim ownership</button>
    <button class="btn secondary" id="startNewBudgetBtn" style="display:none;">Start a new budget on this device</button>

    <button class="btn secondary" id="manageToggle" style="display:none;">Manage sharing ▾</button>
    <div id="managePanel" style="display:none;">
      <div class="row">
        <div class="field">
          <label>Add editor by email</label>
          <input type="text" id="editorEmail" placeholder="name@gmail.com">
        </div>
      </div>
      <button class="btn secondary" id="addEditorBtn">Add editor</button>
      <div id="editorsList" style="margin-top:10px;"></div>
      <button class="btn secondary" id="resetLinkBtn" style="margin-top:16px;">Reset link</button>
    </div>

    <div class="rate-note" id="syncNote">Connecting…</div>
  </div>
</div>

<div class="modal-backdrop" id="statsModalBackdrop" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>Budget history</h2>
      <button class="modal-close" id="statsModalClose" type="button">✕</button>
    </div>
    <div id="statsChart"></div>
  </div>
</div>

<div class="modal-backdrop" id="confirmBackdrop" style="display:none; z-index:300; align-items:center;">
  <div class="modal-sheet" style="border-radius:16px; max-width:380px; margin:0 16px;">
    <div id="confirmMsg" style="font-size:15px; line-height:1.4; margin-bottom:16px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn secondary" id="confirmCancel" style="margin-top:0;">Cancel</button>
      <button class="btn" id="confirmOk" style="margin-top:0;">OK</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTk6opW3slF3OHEVFg2XehhPnr7Kdq5T0",
  authDomain: "daily-budget-2af6a.firebaseapp.com",
  projectId: "daily-budget-2af6a",
  storageBucket: "daily-budget-2af6a.firebasestorage.app",
  messagingSenderId: "493144599667",
  appId: "1:493144599667:web:b0a555bf629f779158ce06"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const googleProvider = new GoogleAuthProvider();
let currentUser = null;
let pendingAuthAction = localStorage.getItem('pendingAuthAction') || null;
onAuthStateChanged(auth, user => { currentUser = user; applyAccessUI(); runPendingAuthAction(); });

const $ = s => document.querySelector(s);
const STORAGE_KEY = 'dailyBudgetApp';
const RATE_KEY = 'dailyBudgetRate';
const BUDGET_ID_KEY = 'dailyBudgetId';

const urlParams = new URLSearchParams(location.search);
let budgetId = urlParams.get('id') || localStorage.getItem(BUDGET_ID_KEY) || crypto.randomUUID();
localStorage.setItem(BUDGET_ID_KEY, budgetId);
if(urlParams.get('id') !== budgetId){
  const url = new URL(location.href);
  url.searchParams.set('id', budgetId);
  history.replaceState(null, '', url);
}
let budgetRef = doc(db, 'budgets', budgetId);
let remoteReady = false;
let ownerUid = null;
let ownerEmail = null;
let editors = [];
let isRevoked = false;

function isOwner(){ return !!(currentUser && ownerUid && currentUser.uid === ownerUid); }
function isEditor(){ return !!(currentUser && currentUser.email && editors.includes(currentUser.email)); }
function canEdit(){ return isOwner() || isEditor(); }

let state = load();
let selectedCurrency = 'UAH';
let usdRate = null; // 1 USD = X UAH
let eurRate = null; // 1 EUR = X UAH
let paidExpanded = false;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { leftover: 0, payments: [], lastResetMonth: null, history: [] };
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if(remoteReady && !isRevoked && canEdit()){
    setDoc(budgetRef, state, { merge: true }).catch(() => setSyncNote('Sync failed — check your connection'));
  }
}

function setSyncNote(msg){
  const el = $('#syncNote');
  if(el) el.textContent = msg;
}

function applyRemoteDoc(data){
  ownerUid = data.ownerUid || null;
  ownerEmail = data.ownerEmail || null;
  editors = data.editors || [];
  isRevoked = !!data.revoked;
  state = {
    leftover: data.leftover || 0,
    payments: data.payments || [],
    lastResetMonth: data.lastResetMonth || null,
    history: data.history || []
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

async function initBudgetSync(){
  try{
    const snap = await getDoc(budgetRef);
    if(snap.exists()){
      applyRemoteDoc(snap.data());
    } else {
      // Always write revoked:false explicitly — the security rules deny reads of docs
      // where the field is absent, which would make a fresh budget look "revoked".
      await setDoc(budgetRef, { ...state, revoked: false });
    }
  }catch(e){
    setSyncNote('Offline — showing last saved data');
  }
  remoteReady = true;
  if(!isRevoked && canEdit()) maybeResetMonthlyPaid();
  render();
  applyAccessUI();
  if(isRevoked) setSyncNote('🔒 This link was reset by the owner — ask for the new one');
  else setSyncNote('Synced ✓');
  runPendingAuthAction();
  onSnapshot(budgetRef, snap => {
    if(snap.exists()){
      applyRemoteDoc(snap.data());
      render();
      applyAccessUI();
      setSyncNote(isRevoked ? '🔒 This link was reset by the owner — ask for the new one' : 'Synced ✓');
      if($('#statsModalBackdrop').style.display === 'flex') renderStatsChart();
    }
  }, err => {
    if(err.code === 'permission-denied'){
      isRevoked = true;
      setSyncNote('🔒 This link was reset by the owner — ask for the new one');
      applyAccessUI();
    } else {
      setSyncNote('Offline — showing last saved data');
    }
  });
}

// intent is remembered across a full-page redirect (needed for iOS standalone, where popups fail).
async function signIn(intent){
  if(isStandalone()){
    if(intent){ localStorage.setItem('pendingAuthAction', intent); pendingAuthAction = intent; }
    try{ await signInWithRedirect(auth, googleProvider); }
    catch(e){ showToast('Sign-in failed'); }
    return null; // page navigates away; nothing more to do here
  }
  try{
    const result = await signInWithPopup(auth, googleProvider);
    return result.user;
  }catch(e){
    // Popup blocked/unsupported — fall back to redirect.
    if(intent){ localStorage.setItem('pendingAuthAction', intent); pendingAuthAction = intent; }
    try{ await signInWithRedirect(auth, googleProvider); }
    catch(e2){ showToast('Sign-in failed'); }
    return null;
  }
}

// After a redirect-based sign-in returns, resume whatever the user was trying to do.
async function runPendingAuthAction(){
  if(!pendingAuthAction || !currentUser || !remoteReady) return;
  const action = pendingAuthAction;
  pendingAuthAction = null;
  localStorage.removeItem('pendingAuthAction');
  if(action === 'claim') await claimOwnership();
  else if(action === 'reset') await resetLink();
  // 'edit' needs no action — applyAccessUI already reflects the signed-in state.
}

async function claimOwnership(){
  let user = currentUser || await signIn('claim');
  if(!user) return;
  try{
    await setDoc(budgetRef, { ownerUid: user.uid, ownerEmail: user.email }, { merge: true });
    ownerUid = user.uid;
    ownerEmail = user.email;
    showToast('You are now the owner of this budget');
    applyAccessUI();
  }catch(e){
    showToast('Could not claim — someone already owns this link');
  }
}

async function resetLink(){
  let user = currentUser || await signIn('reset');
  if(!user) return;
  if(user.uid !== ownerUid){
    showToast('Only the owner can reset this link');
    return;
  }
  if(!(await askConfirm('Reset link? The old link will stop working for everyone who has it. Your current editors stay whitelisted on the new link.'))) return;
  try{
    await setDoc(budgetRef, { revoked: true }, { merge: true });
    const newId = crypto.randomUUID();
    const newRef = doc(db, 'budgets', newId);
    await setDoc(newRef, { ...state, ownerUid: user.uid, ownerEmail: user.email, editors, revoked: false });
    budgetId = newId;
    localStorage.setItem(BUDGET_ID_KEY, budgetId);
    const url = new URL(location.href);
    url.searchParams.set('id', budgetId);
    history.replaceState(null, '', url);
    showToast('Link reset — share the new link');
    location.reload();
  }catch(e){
    showToast('Reset failed: ' + (e.code || ''));
  }
}

async function addEditor(){
  if(!isOwner()){ showToast('Only the owner can add editors'); return; }
  const email = $('#editorEmail').value.trim().toLowerCase();
  if(!email || !email.includes('@')){ showToast('Enter a valid email'); return; }
  try{
    await setDoc(budgetRef, { editors: arrayUnion(email) }, { merge: true });
    $('#editorEmail').value = '';
    showToast('Editor added');
  }catch(e){
    showToast('Could not add editor');
  }
}

async function removeEditor(email){
  if(!isOwner()) return;
  try{
    await setDoc(budgetRef, { editors: arrayRemove(email) }, { merge: true });
    showToast('Editor removed');
  }catch(e){
    showToast('Could not remove editor');
  }
}

function renderEditors(){
  const list = $('#editorsList');
  if(!list) return;
  if(editors.length === 0){
    list.innerHTML = '<div class="empty">No editors added yet</div>';
    return;
  }
  list.innerHTML = editors.map(email => `
    <div class="payment" data-email="${escapeHtml(email)}">
      <div class="info"><div class="name">${escapeHtml(email)}</div></div>
      <button class="del" data-action="removeEditor" type="button">✕</button>
    </div>
  `).join('');
}

function applyAccessUI(){
  const editAllowed = canEdit();
  document.body.classList.toggle('readonly', !editAllowed);
  $('#leftover').readOnly = !editAllowed;
  $('#pName').disabled = !editAllowed;
  $('#pAmount').disabled = !editAllowed;
  $('#pDay').disabled = !editAllowed;
  $('#addBtn').disabled = !editAllowed;
  $('#currSeg').querySelectorAll('button').forEach(b => b.disabled = !editAllowed);

  const accessNote = $('#accessNote');
  const signInBtn = $('#signInBtn');
  const claimBtn = $('#claimBtn');
  const manageToggle = $('#manageToggle');
  const managePanel = $('#managePanel');
  const startNewBudgetBtn = $('#startNewBudgetBtn');

  if(isRevoked){
    accessNote.textContent = '🔒 This link has been reset by the owner';
    signInBtn.style.display = 'none';
    claimBtn.style.display = 'none';
    manageToggle.style.display = 'none';
    managePanel.style.display = 'none';
    startNewBudgetBtn.style.display = 'block';
    return;
  }
  startNewBudgetBtn.style.display = 'none';

  if(!ownerUid){
    accessNote.textContent = 'No owner set yet';
    claimBtn.style.display = currentUser ? 'block' : 'none';
    signInBtn.style.display = currentUser ? 'none' : 'block';
    manageToggle.style.display = 'none';
    managePanel.style.display = 'none';
    return;
  }

  claimBtn.style.display = 'none';

  if(isOwner()){
    accessNote.textContent = 'You own this budget';
    signInBtn.style.display = 'none';
    manageToggle.style.display = 'block';
    renderEditors();
  } else if(isEditor()){
    accessNote.textContent = `Signed in as ${currentUser.email} — you can edit`;
    signInBtn.style.display = 'none';
    manageToggle.style.display = 'none';
    managePanel.style.display = 'none';
  } else if(currentUser){
    accessNote.textContent = `Signed in as ${currentUser.email} — read-only, ask the owner to add you as an editor`;
    signInBtn.style.display = 'none';
    manageToggle.style.display = 'none';
    managePanel.style.display = 'none';
  } else {
    accessNote.textContent = 'Read-only — sign in if you were invited to edit';
    signInBtn.style.display = 'block';
    manageToggle.style.display = 'none';
    managePanel.style.display = 'none';
  }
}

function updateShareLink(){
  const url = new URL(location.href);
  url.searchParams.set('id', budgetId);
  $('#shareLink').value = url.toString();
}

function fmt(n){
  return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function isWeekend(d){
  const day = d.getDay();
  return day === 0 || day === 6;
}

function salaryDateFor(year, month){
  let d = new Date(year, month, 15);
  if(d.getDay() === 6) d.setDate(14);
  else if(d.getDay() === 0) d.setDate(16);
  return d;
}

function nextSalaryDate(from){
  const y = from.getFullYear();
  const m = from.getMonth();
  let candidate = salaryDateFor(y, m);
  const fromMidnight = new Date(y, from.getMonth(), from.getDate());
  if(candidate.getTime() <= fromMidnight.getTime()){
    candidate = salaryDateFor(y, m+1);
  }
  return candidate;
}

function lastSalaryDate(from){
  const y = from.getFullYear();
  const m = from.getMonth();
  let candidate = salaryDateFor(y, m);
  const fromMidnight = new Date(y, from.getMonth(), from.getDate());
  if(candidate.getTime() > fromMidnight.getTime()){
    candidate = salaryDateFor(y, m-1);
  }
  return candidate;
}

function paymentDueDate(p, lastSalary){
  const d = new Date(lastSalary);
  d.setDate(d.getDate() + (Number(p.day)||0));
  return d;
}

function daysBetween(a, b){
  const MS = 24*60*60*1000;
  const a0 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const b0 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((b0 - a0) / MS);
}

function maybeResetMonthlyPaid(){
  const now = new Date();
  const key = now.getFullYear()+'-'+now.getMonth();
  if(state.lastResetMonth !== key){
    // roll over: unmark payments whose due day already passed relative to new cycle start
    state.payments.forEach(p => p.paid = false);
    state.lastResetMonth = key;
    save();
  }
}

async function fetchRate(){
  const cached = JSON.parse(localStorage.getItem(RATE_KEY) || 'null');
  const now = Date.now();
  if(cached && (now - cached.ts) < 12*60*60*1000){
    usdRate = cached.usdRate;
    eurRate = cached.eurRate;
    updateRateNote(cached, false);
  }
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if(data && data.rates && data.rates.UAH){
      usdRate = data.rates.UAH;
      eurRate = data.rates.EUR ? (data.rates.UAH / data.rates.EUR) : null;
      const payload = { usdRate, eurRate, ts: now };
      localStorage.setItem(RATE_KEY, JSON.stringify(payload));
      updateRateNote(payload, true);
      recalcAll();
    }
  }catch(e){
    if(!usdRate){
      updateRateNote(null, false);
    }
  }
}

function updateRateNote(rates, fresh){
  const el = $('#rateNote');
  if(!rates || !rates.usdRate){
    el.textContent = 'Rate unavailable — enter UAH amount directly';
    return;
  }
  const eurPart = rates.eurRate ? `, €1≈${fmt(rates.eurRate)}₴` : '';
  el.innerHTML = `Rate: $1≈${fmt(rates.usdRate)}₴${eurPart} ${fresh ? '(live)' : '(cached)'} <button id="refreshRate" type="button">refresh</button>`;
  $('#refreshRate').onclick = () => { fetchRate(); };
}

function recalcAll(){
  // recompute UAH for foreign-currency payments using latest rates
  if(!usdRate && !eurRate) return;
  state.payments.forEach(p => {
    if(p.currency === 'USD' && usdRate){
      p.amountUAH = p.amountUSD * usdRate;
    } else if(p.currency === 'EUR' && eurRate){
      p.amountUAH = p.amountEUR * eurRate;
    }
  });
  save();
  render();
}

function currentDaySubtitle(){
  const now = new Date();
  const salary = nextSalaryDate(now);
  const days = Math.max(daysBetween(now, salary), 1);
  $('#datesub').textContent = `Next salary: ${salary.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${days} day${days===1?'':'s'} left`;
  return { salary, days };
}

function render(){
  const { days } = currentDaySubtitle();

  const unpaidTotal = state.payments
    .filter(p => !p.paid)
    .reduce((sum,p) => sum + (Number(p.amountUAH)||0), 0);

  const leftover = Number(state.leftover) || 0;
  const remaining = leftover - unpaidTotal;
  const daily = remaining / days;

  const amtEl = $('#dailyAmount');
  amtEl.textContent = `₴${fmt(daily)}`;
  amtEl.className = 'amount ' + (daily < 0 ? 'negative' : 'positive');
  $('#heroDetail').textContent =
    `(₴${fmt(leftover)} left − ₴${fmt(unpaidTotal)} unpaid) ÷ ${days} day${days===1?'':'s'}`;

  $('#leftover').value = state.leftover || '';

  const list = $('#paymentsList');
  if(state.payments.length === 0){
    list.innerHTML = '<div class="empty">No payments yet</div>';
  } else {
    const lastSalary = lastSalaryDate(new Date());
    const sorted = [...state.payments].sort((a,b) => (a.day||0) - (b.day||0));
    const unpaid = sorted.filter(p => !p.paid);
    const paid = sorted.filter(p => p.paid);
    const rowHtml = p => paymentRowHtml(p, lastSalary);

    let html = '';
    html += unpaid.length ? unpaid.map(rowHtml).join('') : '<div class="empty">All payments marked as paid</div>';
    if(paid.length){
      html += `<button class="btn secondary" id="paidToggle" type="button">${paidExpanded ? '▴' : '▾'} Paid (${paid.length})</button>`;
      html += `<div id="paidList" style="display:${paidExpanded ? 'block' : 'none'}; margin-top:10px;">${paid.map(rowHtml).join('')}</div>`;
    }
    list.innerHTML = html;

    const paidToggleBtn = $('#paidToggle');
    if(paidToggleBtn){
      paidToggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        paidExpanded = !paidExpanded;
        render();
      });
    }
  }
}

function paymentRowHtml(p, lastSalary){
  const usdLine = p.currency === 'USD' ? `<div class="usd">$${fmt(p.amountUSD)}</div>` : '';
  const eurLine = p.currency === 'EUR' ? `<div class="usd">€${fmt(p.amountEUR)}</div>` : '';
  const dueDate = paymentDueDate(p, lastSalary);
  const dueLabel = dueDate.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  const offset = Number(p.day) || 0;
  return `
  <div class="payment ${p.paid?'paid':''}" data-id="${p.id}">
    <div class="check" data-action="toggle">${p.paid?'✓':''}</div>
    <div class="info">
      <div class="name ${p.paid?'paid-strike':''}">${escapeHtml(p.name)}</div>
      <div class="meta">${offset} day${offset===1?'':'s'} after salary · ${dueLabel}</div>
    </div>
    <div class="amt">
      <div class="uah">₴${fmt(p.amountUAH)}</div>
      ${usdLine}${eurLine}
    </div>
    <button class="del" data-action="delete">✕</button>
  </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

// Custom in-app confirm — native confirm() silently fails in iOS standalone (Home Screen) apps.
function askConfirm(message){
  return new Promise(resolve => {
    const backdrop = $('#confirmBackdrop');
    $('#confirmMsg').textContent = message;
    backdrop.style.display = 'flex';
    const cleanup = (result) => {
      backdrop.style.display = 'none';
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      backdrop.removeEventListener('click', onBackdrop);
      resolve(result);
    };
    const okBtn = $('#confirmOk');
    const cancelBtn = $('#confirmCancel');
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onBackdrop = (e) => { if(e.target === backdrop) cleanup(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    backdrop.addEventListener('click', onBackdrop);
  });
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function recordHistoryPoint(){
  const salary = nextSalaryDate(new Date());
  const days = Math.max(daysBetween(new Date(), salary), 1);
  const unpaidTotal = state.payments
    .filter(p => !p.paid)
    .reduce((sum,p) => sum + (Number(p.amountUAH)||0), 0);
  const leftover = Number(state.leftover) || 0;
  const daily = (leftover - unpaidTotal) / days;

  state.history = state.history || [];
  state.history.push({ t: Date.now(), v: Math.round(daily*100)/100 });
  if(state.history.length > 300) state.history = state.history.slice(-300);
  save();
}

function renderStatsChart(){
  const container = $('#statsChart');
  const now = new Date();
  const lastSalary = lastSalaryDate(now);
  const nextSalary = nextSalaryDate(now);
  const dayMs = 24*60*60*1000;
  const totalDays = Math.max(Math.round((nextSalary.getTime() - lastSalary.getTime()) / dayMs), 1);

  const slots = [];
  for(let i=0; i<totalDays; i++){
    slots.push({ date: new Date(lastSalary.getTime() + i*dayMs), value: null, t: null });
  }
  (state.history || []).forEach(pt => {
    if(pt.t < lastSalary.getTime() || pt.t >= nextSalary.getTime()) return;
    const idx = Math.floor((pt.t - lastSalary.getTime()) / dayMs);
    if(idx < 0 || idx >= slots.length) return;
    if(slots[idx].t === null || pt.t > slots[idx].t){
      slots[idx].value = pt.v;
      slots[idx].t = pt.t;
    }
  });

  const dataSlots = slots.filter(s => s.value !== null);
  if(dataSlots.length === 0){
    container.innerHTML = '<div class="empty">No data yet since last salary — update "What\'s left on card" to start tracking</div>';
    return;
  }

  const values = dataSlots.map(s => s.value);
  let maxV = Math.max(...values, 0);
  let minV = Math.min(...values, 0);
  if(maxV === minV){ maxV += 1; minV -= 1; }
  const range = maxV - minV;

  const w = 700, h = 320;
  const padL = 60, padR = 10, padT = 14, padB = 34;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const zeroY = padT + (maxV / range) * plotH;
  const slotW = plotW / totalDays;
  const barW = Math.max(slotW * 0.6, 2);

  const tickCount = 4;
  let yAxisHtml = '';
  for(let i=0; i<=tickCount; i++){
    const v = minV + (range * i / tickCount);
    const y = padT + plotH - (plotH * i / tickCount);
    yAxisHtml += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" style="stroke:var(--border); stroke-width:1"/>`;
    yAxisHtml += `<text x="${padL-8}" y="${y+4}" text-anchor="end" style="font-size:11px; fill:var(--muted);">₴${fmt(v)}</text>`;
  }

  const labelEvery = Math.max(Math.ceil(totalDays/6), 1);
  let xAxisHtml = '';
  slots.forEach((s,i) => {
    if(i % labelEvery !== 0 && i !== totalDays-1) return;
    const x = padL + i*slotW + slotW/2;
    xAxisHtml += `<text x="${x}" y="${h-padB+16}" text-anchor="middle" style="font-size:10px; fill:var(--muted);">${s.date.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`;
  });

  let barsHtml = '';
  let hitHtml = '';
  slots.forEach((s,i) => {
    const x = padL + i*slotW;
    hitHtml += `<rect data-i="${i}" x="${x}" y="${padT}" width="${slotW}" height="${plotH}" fill="transparent" style="cursor:pointer;"/>`;
    if(s.value === null) return;
    const barH = Math.max(Math.abs(s.value)/range * plotH, 1);
    const barY = s.value >= 0 ? zeroY - barH : zeroY;
    const color = s.value >= 0 ? 'var(--accent)' : 'var(--danger)';
    const barX = x + (slotW - barW)/2;
    barsHtml += `<rect x="${barX}" y="${barY}" width="${barW}" height="${barH}" rx="2" style="fill:${color}; pointer-events:none;"/>`;
  });

  container.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:260px; display:block;" id="statsSvg">
      ${yAxisHtml}
      <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" style="stroke:var(--muted); stroke-width:1"/>
      ${barsHtml}
      ${xAxisHtml}
      ${hitHtml}
    </svg>
    <div class="rate-note">${lastSalary.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${nextSalary.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${dataSlots.length}/${totalDays} day${totalDays===1?'':'s'} tracked</div>
    <div id="chartLegend" class="chart-legend" style="display:none;"></div>
  `;

  $('#statsSvg').addEventListener('click', e => {
    const rect = e.target.closest('rect[data-i]');
    if(!rect) return;
    const idx = Number(rect.dataset.i);
    const s = slots[idx];
    const legend = $('#chartLegend');
    legend.style.display = 'block';
    const dateLabel = s.date.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
    legend.innerHTML = s.value === null
      ? `<strong>${dateLabel}</strong> — no data recorded`
      : `<strong>${dateLabel}</strong> — Daily budget: ₴${fmt(s.value)}`;
  });
}

// events
$('#currSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  selectedCurrency = btn.dataset.c;
  [...$('#currSeg').children].forEach(b => b.classList.toggle('active', b === btn));
  $('#amtLabel').textContent = `Amount (${selectedCurrency})`;
});

$('#leftover').addEventListener('input', e => {
  if(!canEdit()) return;
  state.leftover = parseFloat(e.target.value) || 0;
  save();
  render();
});

$('#leftover').addEventListener('change', () => {
  if(!canEdit()) return;
  recordHistoryPoint();
});

$('#addBtn').addEventListener('click', () => {
  if(!canEdit()){ showToast('Read-only — ask the owner for edit access'); return; }
  const name = $('#pName').value.trim();
  const amount = parseFloat($('#pAmount').value);
  const day = parseInt($('#pDay').value, 10);

  if(!name){ showToast('Enter a name'); return; }
  if(!amount || amount <= 0){ showToast('Enter an amount'); return; }
  if(isNaN(day) || day < 0 || day > 31){ showToast('Enter a valid number of days (0-31)'); return; }

  let amountUSD = null, amountEUR = null, amountUAH;
  if(selectedCurrency === 'USD'){
    if(!usdRate){ showToast('Rate not loaded yet, try again shortly'); return; }
    amountUSD = amount;
    amountUAH = amount * usdRate;
  } else if(selectedCurrency === 'EUR'){
    if(!eurRate){ showToast('Rate not loaded yet, try again shortly'); return; }
    amountEUR = amount;
    amountUAH = amount * eurRate;
  } else {
    amountUAH = amount;
  }

  state.payments.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name,
    currency: selectedCurrency,
    amountUSD,
    amountEUR,
    amountUAH,
    day,
    paid: false
  });
  save();
  render();

  $('#pName').value = '';
  $('#pAmount').value = '';
  $('#pDay').value = '';
  showToast('Payment added');
});

$('#paymentsList').addEventListener('click', async e => {
  if(!canEdit()){ showToast('Read-only — ask the owner for edit access'); return; }
  const row = e.target.closest('.payment');
  if(!row) return;
  const id = row.dataset.id;
  const action = e.target.closest('[data-action]')?.dataset.action;
  if(action === 'toggle'){
    const p = state.payments.find(p => p.id === id);
    if(p) p.paid = !p.paid;
    save();
    render();
  } else if(action === 'delete'){
    if(await askConfirm('Delete this payment?')){
      state.payments = state.payments.filter(p => p.id !== id);
      save();
      render();
    }
  }
});

$('#shareBtn').addEventListener('click', async () => {
  const link = $('#shareLink').value;
  if(navigator.share){
    try{ await navigator.share({ title: 'Daily Budget', url: link }); } catch(e){}
    return;
  }
  try{
    await navigator.clipboard.writeText(link);
    showToast('Link copied');
  }catch(e){
    $('#shareLink').removeAttribute('readonly');
    $('#shareLink').select();
    document.execCommand('copy');
    $('#shareLink').setAttribute('readonly', true);
    showToast('Link copied');
  }
});

$('#claimBtn').addEventListener('click', claimOwnership);
$('#resetLinkBtn').addEventListener('click', resetLink);
$('#addEditorBtn').addEventListener('click', addEditor);

$('#startNewBudgetBtn').addEventListener('click', async () => {
  if(!(await askConfirm('Start a brand new, empty budget on this device? This link stays revoked — this only affects what this device points to.'))) return;
  localStorage.removeItem(BUDGET_ID_KEY);
  localStorage.removeItem(STORAGE_KEY);
  const url = new URL(location.href);
  url.searchParams.delete('id');
  location.href = url.toString();
});

$('#signInBtn').addEventListener('click', async () => {
  const user = await signIn('edit');
  if(user) applyAccessUI();
});

$('#manageToggle').addEventListener('click', () => {
  const panel = $('#managePanel');
  const expanded = panel.style.display !== 'none';
  panel.style.display = expanded ? 'none' : 'block';
  $('#manageToggle').textContent = expanded ? 'Manage sharing ▾' : 'Manage sharing ▴';

$('#editorsList').addEventListener('click', async e => {
  const btn = e.target.closest('[data-action="removeEditor"]');
  if(!btn) return;
  const email = btn.closest('[data-email]').dataset.email;
  if(await askConfirm(`Remove ${email}'s edit access?`)) removeEditor(email);
});

function closeModal(el){ el.style.display = 'none'; }

  openModal($('#statsModalBackdrop'));

  if(e.target === $('#statsModalBackdrop')) closeModal($('#statsModalBackdrop'));
});

getRedirectResult(auth).catch(() => {}); // completes redirect sign-in; onAuthStateChanged handles the result
updateShareLink();
render();
fetchRate();
initBudgetSync();
